name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pipeline-test:
    name: 素材管线测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_refs.py 需全历史验证 docs/14 引用的 commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: 安装依赖（验证 requirements.txt 本身有效）
        run: pip install -r requirements.txt pytest ruff
      - name: lint（ruff）
        run: ruff check pipeline/ tests/
      - name: 冒烟测试
        run: python tests/smoke_test.py
      - name: 单元测试（边界情况）
        run: pytest tests/test_pipeline.py -v 2>&1 | tee /tmp/pytest.log; exit ${PIPESTATUS[0]}
      - name: 失败上报（debug——把 pytest 输出打进 annotation 供 API 读取）
        if: failure()
        shell: bash
        run: |
          python3 << 'PYEOF'
          import re
          try:
              lines = open('/tmp/pytest.log').read().splitlines()
          except FileNotFoundError:
              lines = ['(无日志文件)']
          # 打印所有 E 行（pytest traceback 详情）
          e_lines = [i for i, l in enumerate(lines) if l.startswith('E ')]
          if e_lines:
              for i in e_lines[:40]:
                  # 带上 E 行之前的一行（断言位置）
                  if i-1 >= 0:
                      print('::error::' + lines[i-1][:240])
                  print('::error::' + lines[i][:240])
          else:
              print('::error::---- 无 E 行，日志尾部 ----')
              for l in lines[-30:]:
                  print('::error::' + l[:240])
          PYEOF
      - name: 宠物包校验（demo v3）
        run: python pipeline/validate_pet.py examples/redshao-demo/
      - name: 台账测试计数一致性（pytest 侧——防 docs/13 计数漂移）
        run: python pipeline/check_test_counts.py --side python
      - name: schema↔docs 漂移检查（docs/08 字段表须与 schema 一致）
        run: python pipeline/check_docs_sync.py
      - name: 实现状态矩阵引用检查（docs/14 符号/文件/commit 须真实存在）
        run: python pipeline/check_refs.py

  viewer-build:
    name: 客户端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建（vite build）
        run: npm run build
        working-directory: viewer
      - name: 单元测试（vitest）
        run: npm test
        working-directory: viewer
      - name: 台账测试计数一致性（vitest 侧——防 docs/13 计数漂移）
        run: python3 ../pipeline/check_test_counts.py --side js
        working-directory: viewer
      - name: 校验构建产物
        run: test -f dist/index.html && echo "✅ dist/index.html 存在" && ls dist/assets/ | head -5
        working-directory: viewer

  viewer-mac-package:
    name: macOS 构建（唯一实测平台，必须覆盖）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建渲染层（vite build，含 tsc 类型检查）
        run: npm run build
        working-directory: viewer
      - name: 单元测试（vitest）
        run: npm test
        working-directory: viewer
      - name: 台账测试计数一致性（vitest 侧——防 docs/13 计数漂移）
        run: python3 ../pipeline/check_test_counts.py --side js
        working-directory: viewer
      - name: 校验 dist 产物
        run: test -f dist/index.html && echo "✅ index.html 存在"
        working-directory: viewer
      - name: 打包 macOS 安装包（dmg）
        run: npx electron-builder --mac 2>&1 | tee dist.log || { tail -50 dist.log; exit 1; }
        working-directory: viewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 校验 app.asar 关键模块（防 files 白名单漏文件——v1.2.0 事故）
        run: |
          APP=$(ls -d release/mac*/PawPal.app 2>/dev/null | head -1)
          test -n "$APP" || { echo "❌ 未找到 .app"; exit 1; }
          for f in main.js pet-import.cjs security-utils.cjs preload.cjs; do
            npx asar list "$APP/Contents/Resources/app.asar" | grep -q "$f" && echo "✅ $f 已打包" || { echo "❌ $f 缺失"; exit 1; }
          done
        working-directory: viewer
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: PawPal-macos
          path: viewer/release/*.dmg
          if-no-files-found: error

  viewer-win-package:
    name: Windows 安装包构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: viewer
      - name: 构建渲染层（vite build）
        run: npm run build
        working-directory: viewer
      - name: 校验 dist 产物
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (Test-Path dist/index.html) { Write-Host "✅ index.html 存在" } else { Write-Host "❌ index.html 缺失"; exit 1 }
        working-directory: viewer
      - name: 打包 Windows 安装包（nsis + portable）
        shell: bash
        run: |
          npx electron-builder --win 2>&1 | tee dist.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::electron-builder 失败，日志尾部："
            tail -50 dist.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          echo "::group::electron-builder 日志尾部"
          tail -60 dist.log
          echo "::endgroup::"
          exit $EXIT_CODE
        working-directory: viewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 失败时发布构建日志到 issue（供排查）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('viewer/dist.log') ? fs.readFileSync('viewer/dist.log', 'utf8').slice(-4000) : '（无日志文件）';
            const body = '## Windows 打包失败日志（自动上报）\n```\n' + log + '\n```';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            let issue = issues.find(i => i.title === 'CI Windows 打包失败日志');
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'CI Windows 打包失败日志',
                body
              });
            }
      - name: 校验 app.asar 关键模块（防 files 白名单漏文件——v1.2.0 事故）
        shell: bash
        run: |
          APP=$(ls -d release/win-unpacked/resources/app.asar 2>/dev/null | head -1)
          test -n "$APP" || { echo "❌ 未找到 app.asar"; exit 1; }
          for f in main.js pet-import.cjs security-utils.cjs preload.cjs; do
            npx asar list "$APP" | grep -q "$f" && echo "✅ $f 已打包" || { echo "❌ $f 缺失"; exit 1; }
          done
        working-directory: viewer
      - name: 校验示例宠物包已随安装包分发
        shell: pwsh
        run: |
          $dir = "release/win-unpacked/resources/examples/doudou-demo"
          if (-not (Test-Path "$dir/pet.json")) { throw "❌ 示例宠物包没打进安装包：$dir/pet.json 不存在" }
          $json = Get-Content "$dir/pet.json" -Raw | ConvertFrom-Json
          if ($json.id -ne 'doudou-demo') { throw "❌ 示例包 id 异常：$($json.id)" }
          $sheets = Get-ChildItem "$dir" -Filter *.webp
          if ($sheets.Count -lt 1) { throw "❌ 示例包精灵表缺失" }
          Write-Host "✅ 示例宠物包已随包分发：$($json.name) / $($sheets.Count) 张精灵表"
        working-directory: viewer
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: PawPal-windows
          path: |
            viewer/release/*.exe
            viewer/release/*.blockmap
          if-no-files-found: error

  release:
    name: 发布 GitHub Release（tag 触发）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [viewer-mac-package, viewer-win-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 macOS 安装包
        uses: actions/download-artifact@v4
        with:
          name: PawPal-macos
          path: artifacts/macos
      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: PawPal-windows
          path: artifacts/windows
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.exe
            artifacts/windows/*.blockmap
          generate_release_notes: true
          # 正式发布（不留在草稿态）；tag 推上去后由 CI 自动生成并公开
          draft: false
          prerelease: false
          append_body: true
          body: |
            ## 安装说明

            - **macOS**：下载 `.dmg` 打开拖进 Applications。安装包**未签名**，首次打开若被拦截，
              请到「系统设置 → 隐私与安全性」点「仍要打开」，或右键 App →「打开」。
            - **Windows**：下载 `.exe` 安装。安装包**未签名**，SmartScreen 提示时点「更多信息 → 仍要运行」。
            - 宠物素材与数值数据都在 `~/.petpet/`（Windows 为 `%USERPROFILE%\.petpet`），升级不会清空。

            ## 使用

            装好后托盘/桌宠右键 →「📘 使用说明」，里面有**从照片到会动的桌宠**的完整四步：
            重绘形象 → 生成动作视频 → 抽帧拼表（可反复重抽，不花钱）→ 装配应用。

            > AI 重绘与动画生成需要自备火山引擎密钥（本地 `~/.petpet/ark.json`，权限 0600，
            > 只在主进程使用，渲染层拿不到明文）。不配置密钥则完全不联网，手工素材照常可用。
